name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y clang cmake python3-pytest
      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j
      - name: Unit and CLI smoke tests
        run: ctest --test-dir build --output-on-failure
      - name: End-to-end example and declaration tests
        run: python3 -m pytest tests -q
      - name: Differential tests against C
        run: python3 tests/differential/run_differential.py --cc clang
